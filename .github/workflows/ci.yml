name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      # The MiniLM tests compare against recorded vectors, so CI needs the real weights.
      - uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-6fd5d72f
      - name: MiniLM weights, checked against their SHA-256
        run: finrag model
      - name: Tests
        run: pytest -q

  gate:
    # The BM25 pipeline on the 40 real filings behind the 50 dev questions, compared with the
    # run recorded in configs/gate.json. See src/finrag/gate.py for the threshold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v6
        with:
          path: gate-data/pdfs
          key: gate-pdfs-${{ hashFiles('configs/gate.json', 'configs/financebench.sha256') }}
      - name: Filings, checked against their SHA-256
        run: finrag download --data-dir gate-data --filings configs/gate.json
      - name: Page text
        run: finrag pages --data-dir gate-data
      - name: Gate
        run: finrag gate --data-dir gate-data

  image:
    # Build the service image and query it, BM25 only, on the synthetic fixture corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t finrag .
      - name: Smoke test
        run: |
          cp -r tests/fixtures/mini /tmp/mini && chmod -R a+w /tmp/mini
          docker run -d --name finrag -p 8000:8000 -v /tmp/mini:/data finrag
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -sf "http://127.0.0.1:8000/search?method=bm25&q=What+is+Acme%27s+FY2021+working+capital%3F" \
            | python3 -c "import json,sys; h=json.load(sys.stdin)['hits'][0]; assert (h['doc'], h['page']) == ('ACME_2021_10K', 4), h"
          docker logs finrag

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  web:
    # The browser port must rank pages exactly as Python does on an export of the fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -e .
      - run: finrag export-demo --data-dir tests/fixtures/mini --split tests/fixtures/mini/split.json --aliases "" --results "" --out web/test/data
      - run: npm test
        working-directory: web
