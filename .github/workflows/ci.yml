name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and pipeline tests
        run: pytest -q
      - name: Fixture benchmark
        run: finrag bench --config configs/ci.yaml --out ci-results
      - name: Retrieval quality gate
        run: finrag gate --results ci-results/benchmark.json --baseline configs/gate.json
