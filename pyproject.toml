[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Retrieval benchmark for RAG over SEC filings, built on FinanceBench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bharath Mandha" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "faiss-cpu>=1.8",
  "bm25s>=0.2.0",
  "pypdf>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
