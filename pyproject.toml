[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Page-level retrieval over SEC filings, evaluated on FinanceBench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharath Mandha" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pymupdf==2.0",  # the extracted page text is the benchmark corpus, so the extractor is pinned
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.1", "bm25s>=0.2.0"]
generate = ["openai>=3.36,<4"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
