[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "2.0.0"
description = "Page-level retrieval over SEC filings, evaluated on FinanceBench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharath Mandha" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pymupdf==2.0",          # page text extraction; pinned because the text is the benchmark
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.1", "bm25s>=0.2.0"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
