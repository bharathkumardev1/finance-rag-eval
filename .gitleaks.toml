# The evaluation records hold SHA-256 values that the generic-api-key rule reads as keys:
# the request hashes in results/generation/calls.jsonl, and the tokenizer checksums in
# results/eval.json and the results/rerank*.json files. The exception is attached to
# generic-api-key itself and needs the file and a bare hex value to match, so any other
# secret, in those files or anywhere else, still fails the scan.
# Checked on gitleaks 8.25 to 8.30.1 against the full history.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "SHA-256 values recorded by the evaluations"
condition = "AND"
paths = ['''^results/(generation/calls\.jsonl|eval\.json|rerank(-windows[0-9]+)?\.json)$''']
regexes = ['''^[0-9a-f]{10,64}$''']
